<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Class Vote</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,800&family=JetBrains+Mono:wght@400;600&display=swap">
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script>
<script src="firebase-config.js"></script>
<style>
:root{
  --ground:#EEF2F1; --surface:#FFFFFF; --surface-2:#F6F8F8; --ink:#14232A; --muted:#56676C; --line:#CFD9D7;
  --accent:#1D6A73; --accent-ink:#FFFFFF; --mark:#F4C542; --mark-soft:#FFF3C7;
  --good:#237A4B; --good-soft:#DDF1E4; --bad:#B2362F; --bad-soft:#F8DEDC;
  --code-bg:#12212A; --code-ink:#E4EEEC;
  --display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --body:"Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --mono:"JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark){
  :root{ --ground:#0D171C; --surface:#15232A; --surface-2:#1A2B33; --ink:#E4EEEC; --muted:#9CB0B3; --line:#2B3E46;
    --accent:#5FC3CB; --accent-ink:#0D171C; --mark-soft:#3A3217; --good:#6FD39A; --good-soft:#173627; --bad:#F2877F; --bad-soft:#3E1D1B; --code-bg:#0A141A; }
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--ground);color:var(--ink);font-family:var(--body);font-size:18px;line-height:1.45;padding-inline:16px;padding-block:max(16px,env(safe-area-inset-top,0px)) max(24px,env(safe-area-inset-bottom,0px));min-height:100vh}
button,input{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--mark);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto;display:grid;gap:16px}
header{display:flex;justify-content:space-between;align-items:center;gap:10px}
header b{font-family:var(--display);font-weight:800;font-size:1.2rem}
.room{font-family:var(--mono);font-weight:600;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px 12px;font-size:.9rem}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px;display:grid;gap:14px}
h1{font-family:var(--display);font-weight:800;font-size:1.6rem;line-height:1.15;margin:0;text-wrap:balance}
.ko{color:var(--muted);font-size:.9rem}
label{font-weight:700}
.codein{font-family:var(--mono);font-size:2rem;letter-spacing:.2em;text-transform:uppercase;text-align:center;border:2px solid var(--line);border-radius:12px;padding:10px;background:var(--surface-2);width:100%}
.btn{border:0;border-radius:12px;padding:14px 18px;font-weight:700;background:var(--accent);color:var(--accent-ink);font-size:1.05rem;cursor:pointer}
.btn:disabled{opacity:.5}
.err{color:var(--bad);font-weight:700}
pre{background:var(--code-bg);color:var(--code-ink);font-family:var(--mono);border-radius:10px;padding:12px 14px;margin:0;overflow-x:auto;font-size:.95rem}
.opts{display:grid;gap:10px}
.opt{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:center;text-align:left;border:2px solid var(--line);background:var(--surface);border-radius:14px;padding:12px 14px;cursor:pointer;min-height:64px}
.opt .l{font-family:var(--display);font-weight:800;font-size:1.4rem;width:1.8em;height:1.8em;border-radius:10px;display:grid;place-items:center;background:var(--surface-2)}
.opt span:last-child{font-family:var(--mono);white-space:pre-wrap}
.opt[aria-pressed="true"]{border-color:var(--accent);background:var(--mark-soft)}
.opt[aria-pressed="true"] .l{background:var(--accent);color:var(--accent-ink)}
.opt.right{border-color:var(--good);background:var(--good-soft)}
.opt.wrongpick{border-color:var(--bad);background:var(--bad-soft)}
.opt:disabled{cursor:default}
.status{text-align:center;font-weight:700}
.wait{text-align:center;display:grid;gap:10px;padding:26px 10px}
.dots{display:flex;gap:8px;justify-content:center}
.dots i{width:12px;height:12px;border-radius:50%;background:var(--accent);animation:b 1.2s infinite}
.dots i:nth-child(2){animation-delay:.2s}.dots i:nth-child(3){animation-delay:.4s}
@keyframes b{0%,80%,100%{opacity:.25}40%{opacity:1}}
@media (prefers-reduced-motion:reduce){.dots i{animation:none}}
.result{border-radius:12px;padding:12px;text-align:center;font-weight:700}
.result.good{background:var(--good-soft);color:var(--good)}
.result.bad{background:var(--bad-soft);color:var(--bad)}
.small{font-size:.85rem;color:var(--muted);text-align:center}
.hdr{display:flex;gap:6px;align-items:center}
.score{font-weight:700;background:var(--good-soft);color:var(--good);border-radius:999px;padding:3px 12px;font-size:.9rem}
.count{display:flex;justify-content:center;align-items:baseline;gap:8px;font-weight:700}
.count b{font-family:var(--display);font-size:2rem;font-variant-numeric:tabular-nums;color:var(--accent)}
.opt{position:relative;overflow:hidden}
.opt .fill{position:absolute;inset:0 auto 0 0;background:var(--accent);opacity:.12;transition:width .4s;pointer-events:none}
.opt:has(.n){padding-right:44px}
.opt .n{position:absolute;right:12px;top:50%;transform:translateY(-50%);font-family:var(--mono);font-weight:600;color:var(--muted)}
@media (prefers-reduced-motion:reduce){.opt .fill{transition:none}}
</style>
</head>
<body>
<div class="wrap">
  <header><b>Class vote</b><span class="hdr"><span class="score" id="scoreTag" hidden></span><span class="room" id="roomTag" hidden></span></span></header>

  <section class="card" id="join">
    <h1>Join your class</h1>
    <p class="ko">Type the room code on the board · 칠판에 있는 방 코드를 입력하세요</p>
    <label for="code">Room code</label>
    <input class="codein" id="code" maxlength="5" autocomplete="off" autocapitalize="characters" spellcheck="false" inputmode="text">
    <button class="btn" id="joinBtn">Join</button>
    <p class="err" id="joinErr" aria-live="polite"></p>
    <p class="small">No names are collected. Your vote is anonymous.</p>
  </section>

  <section class="card" id="waiting" hidden>
    <div class="wait">
      <div class="dots" aria-hidden="true"><i></i><i></i><i></i></div>
      <h1 id="waitTitle">Waiting for your teacher</h1>
      <p class="ko" id="waitKo">선생님이 질문을 열 때까지 기다려 주세요</p>
      <p id="waitMine" class="status"></p>
    </div>
  </section>

  <section class="card" id="question" hidden>
    <h1 id="qTitle"></h1>
    <pre id="qCode" hidden></pre>
    <div class="count" id="qCount" aria-live="polite"></div>
    <div class="opts" id="qOpts"></div>
    <p class="status" id="qStatus" aria-live="polite"></p>
    <div id="qResult" aria-live="polite"></div>
  </section>

  <section class="card" id="ended" hidden>
    <h1>This session has ended</h1>
    <p class="ko">수업 투표가 끝났습니다. 감사합니다!</p>
  </section>
</div>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const show = id => ['join','waiting','question','ended'].forEach(x => $('#'+x).hidden = x!==id);
let db, uid, code='', room=null, pending={}, off=null;

const configured = !!(window.firebase && window.FIREBASE_CONFIG && FIREBASE_CONFIG.apiKey && !/PASTE/i.test(FIREBASE_CONFIG.apiKey) && FIREBASE_CONFIG.databaseURL);
const qp = new URLSearchParams(location.search).get('room');
if(qp) $('#code').value = qp.toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,5);
if(!configured){ $('#joinErr').textContent = 'Voting has not been set up yet. Ask your teacher.'; $('#joinBtn').disabled = true; }

async function join(){
  const c = $('#code').value.toUpperCase().replace(/[^A-Z0-9]/g,'');
  if(c.length !== 5){ $('#joinErr').textContent = 'The room code has 5 letters or numbers.'; return; }
  $('#joinErr').textContent = ''; $('#joinBtn').disabled = true; $('#joinBtn').textContent = 'Joining…';
  try{
    if(!firebase.apps.length) firebase.initializeApp(FIREBASE_CONFIG);
    const cred = await firebase.auth().signInAnonymously(); uid = cred.user.uid; db = firebase.database();
    const snap = await db.ref('rooms/'+c).get();
    if(!snap.exists()){ throw new Error('Room not found. Check the code on the board.'); }
    code = c;
    await db.ref(`rooms/${code}/joined/${uid}`).set(true);
    $('#roomTag').textContent = 'Room ' + code; $('#roomTag').hidden = false;
    const ref = db.ref('rooms/'+code);
    const cb = ref.on('value', s => { room = s.val(); render(); });
    off = () => ref.off('value', cb);
    history.replaceState(null, '', '?room='+code);
  }catch(e){
    $('#joinErr').textContent = e.message && !/permission/i.test(e.message) ? e.message : 'Could not join. Check the code and try again.';
    $('#joinBtn').disabled = false; $('#joinBtn').textContent = 'Join';
  }
}
$('#joinBtn').onclick = join;
$('#code').addEventListener('keydown', e => { if(e.key === 'Enter') join(); });

function score(){
  const ans = room && room.answers ? room.answers : {}; const ids = Object.keys(ans);
  if(!ids.length){ $('#scoreTag').hidden = true; return; }
  let right = 0, tried = 0;
  ids.forEach(q => { const v = room.votes && room.votes[q] ? room.votes[q][uid] : undefined; if(v !== undefined){ tried++; if(v === ans[q]) right++; } });
  $('#scoreTag').textContent = `✓ ${right} / ${ids.length}`; $('#scoreTag').hidden = false;
  $('#scoreTag').title = `You answered ${tried} of ${ids.length} marked questions and got ${right} right.`;
}
function render(){
  if(!room){ show('ended'); $('#scoreTag').hidden = true; if(off) off(); return; }
  score();
  const q = room.question, active = room.active;
  if(!q || !active || q.id !== active){ show('waiting'); $('#waitTitle').textContent = 'Waiting for your teacher'; $('#waitKo').textContent = '선생님이 질문을 열 때까지 기다려 주세요'; $('#waitMine').textContent=''; return; }
  const votes = room.votes && room.votes[active] ? room.votes[active] : {};
  const saved = votes[uid];
  const mine = pending[active] !== undefined ? pending[active] : saved;
  const revealed = typeof room.reveal === 'number' && room.reveal >= 0;
  if(!room.open && mine === undefined && !revealed){ show('waiting'); $('#waitTitle').textContent = 'Voting is closed'; $('#waitKo').textContent = '다음 질문을 기다려 주세요'; $('#waitMine').textContent=''; return; }
  show('question');
  $('#qTitle').textContent = q.title;
  $('#qCode').hidden = !q.code; $('#qCode').textContent = q.code || '';
  const L = 'ABCDEF', opts = q.options || [];
  const counts = opts.map(() => 0); Object.values(votes).forEach(v => { if(typeof v === 'number' && counts[v] !== undefined) counts[v]++; });
  const total = counts.reduce((a,b)=>a+b,0);
  const bars = !!room.showLive || revealed || q.kind === 'checkin';
  $('#qCount').innerHTML = `<b>${total}</b> <span>vote${total===1?'':'s'} in${room.open ? '' : ' · voting closed'}</span>`;
  $('#qOpts').innerHTML = opts.map((o,i) => {
    let cls = 'opt';
    if(revealed && i === room.reveal) cls += ' right';
    else if(revealed && i === mine) cls += ' wrongpick';
    const w = bars && total ? Math.round(counts[i]/total*100) : 0;
    return `<button class="${cls}" data-i="${i}" aria-pressed="${i===mine}" ${room.open?'':'disabled'}>${bars?`<span class="fill" style="width:${w}%"></span><span class="n">${counts[i]}</span>`:''}<span class="l">${L[i]}</span><span>${esc(o)}</span></button>`;
  }).join('');
  document.querySelectorAll('#qOpts .opt').forEach(b => b.onclick = () => vote(active, +b.dataset.i));
  $('#qStatus').textContent = room.open ? (mine === undefined ? 'Tap your answer. You can change it until voting closes.' : `Vote sent: ${L[mine]}. You can still change it.`) : (mine !== undefined ? `Voting closed. You voted ${L[mine]}.` : 'Voting closed.');
  $('#qResult').innerHTML = revealed && mine !== undefined ? (mine === room.reveal ? '<div class="result good">Correct! 정답입니다!</div>' : `<div class="result bad">Not this time. The answer was ${L[room.reveal]}.</div>`) : '';
}

async function vote(q, i){
  pending[q] = i; render();
  try{ await db.ref(`rooms/${code}/votes/${q}/${uid}`).set(i); delete pending[q]; render(); }
  catch(e){ delete pending[q]; render(); $('#qStatus').textContent = 'Your vote was not sent. Voting may have closed.'; }
}
</script>
</body>
</html>
